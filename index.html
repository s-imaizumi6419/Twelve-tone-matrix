<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>十二音技法 マトリクスジェネレーター</title>
    <!-- Tailwind CSSの読み込み (スタイリング用) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* カスタムフォントとテーブルのスクロール設定 */
        body { font-family: 'Inter', sans-serif; }
        .matrix-table th, .matrix-table td {
            width: 3rem;
            height: 3rem;
            text-align: center;
            vertical-align: middle;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">

    <header class="bg-indigo-600 text-white p-6 shadow-md">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-3xl font-bold">十二音音列 作成支援ツール</h1>
            <p class="mt-2 opacity-90">1オクターブ内の12の音を使用した音列を生成します。</p>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 mt-6">
        
        <!-- コントロールパネル -->
        <div class="bg-white rounded-xl shadow-sm p-6 mb-8 border border-gray-100">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">音列の入力</h2>
            
            <div class="mb-4">
                <label for="noteInput" class="block text-sm font-medium text-gray-600 mb-1">
                    12の音をスペースまたはカンマ区切りで入力してください。
                </label>
                <div class="flex flex-col sm:flex-row gap-3">
                    <input type="text" id="noteInput" 
                        class="flex-grow px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"
                        placeholder="C C# D D# E F F# G G# A A# B">
                    <button id="generateBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg font-medium transition-colors shadow-sm whitespace-nowrap">
                        マトリクス生成
                    </button>
                </div>
                <p class="text-xs text-gray-500 mt-2">※ フラット (Db, Eb, Gb, Ab, Bb) も入力可能です。</p>
                
                <!-- 【追加部分】残りの音を表示するコンテナ -->
                <div id="remainingNotesContainer" class="mt-3 text-sm text-gray-600 bg-gray-50 p-2 rounded border border-gray-200">
                    残りの音: <span id="remainingNotesList" class="font-mono font-medium text-indigo-600 tracking-wider">C C# D D# E F F# G G# A A# B</span>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <div class="flex-grow border-t border-gray-200"></div>
                <span class="text-sm text-gray-400">または</span>
                <div class="flex-grow border-t border-gray-200"></div>
            </div>

            <div class="mt-4 text-center">
                <button id="randomBtn" class="bg-emerald-500 hover:bg-emerald-600 text-white px-6 py-2 rounded-lg font-medium transition-colors shadow-sm">
                    AIで音列を生成する
                </button>
            </div>

            <!-- エラーメッセージ表示領域 -->
            <div id="errorMessage" class="hidden mt-4 p-4 bg-red-50 text-red-700 border border-red-200 rounded-lg text-sm">
            </div>
        </div>

        <div id="resultsArea" class="hidden space-y-8">
            
            <!-- P0 リスト表示 -->
            <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
                <h2 class="text-2xl font-bold text-gray-800 border-b pb-2 mb-4">基本形 (Prime P0)</h2>
                <div id="primeList" class="font-mono text-lg bg-gray-50 p-4 rounded-lg overflow-x-auto whitespace-pre">
                    <!-- JavaScriptでここにリストが挿入されます -->
                </div>
            </div>

            <!-- マトリクス表示 -->
            <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
                <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center border-b pb-2 mb-4 gap-2">
                    <h2 class="text-2xl font-bold text-gray-800">12音マトリクス (Tone Row Matrix)</h2>
                    <button id="downloadCsvBtn" class="text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg font-medium transition-colors border border-gray-300 shadow-sm flex items-center justify-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                        Excel(CSV)で保存
                    </button>
                </div>
                <p class="text-sm text-gray-600 mb-6">
                    ※ 横に右へ読むと基本形(P)、左へ読むと逆行形(R)、<br class="sm:hidden">
                    縦に下へ読むと反行形(I)、上へ読むと逆行の反行形(RI)になります。
                </p>
                <div class="overflow-x-auto flex justify-center pb-4">
                    <table class="matrix-table border-collapse font-mono text-lg bg-white shadow-sm border border-gray-200">
                        <!-- JavaScriptでここにテーブルが挿入されます -->
                        <thead id="matrixHead" class="bg-indigo-50 font-bold text-indigo-900 border-b-2 border-indigo-200"></thead>
                        <tbody id="matrixBody"></tbody>
                        <tfoot id="matrixFoot" class="bg-indigo-50 font-bold text-indigo-900 border-t-2 border-indigo-200"></tfoot>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script>
        // 音名の定義
        const NOTES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const FLAT_TO_SHARP = {
            'DB': 'C#', 'EB': 'D#', 'GB': 'F#', 'AB': 'G#', 'BB': 'A#',
            'CB': 'B', 'FB': 'E', 'E#': 'F', 'B#': 'C'
        };

        // DOM要素の取得
        const noteInput = document.getElementById('noteInput');
        const generateBtn = document.getElementById('generateBtn');
        const randomBtn = document.getElementById('randomBtn');
        const errorMessage = document.getElementById('errorMessage');
        const resultsArea = document.getElementById('resultsArea');
        const primeList = document.getElementById('primeList');
        const matrixHead = document.getElementById('matrixHead');
        const matrixBody = document.getElementById('matrixBody');
        const matrixFoot = document.getElementById('matrixFoot');
        // 【追加部分】残りの音コンテナを取得
        const remainingNotesContainer = document.getElementById('remainingNotesContainer');
        const downloadCsvBtn = document.getElementById('downloadCsvBtn');

        // 音名を数値(0-11)に変換
        function noteToInt(noteStr) {
            let upperNote = noteStr.toUpperCase();
            if (FLAT_TO_SHARP[upperNote]) {
                upperNote = FLAT_TO_SHARP[upperNote];
            }
            return NOTES.indexOf(upperNote);
        }

        // 数値を音名に変換
        function intToNote(noteInt) {
            return NOTES[(noteInt % 12 + 12) % 12];
        }

        // 移高(トランスポーズ)処理
        function transpose(row, interval) {
            return row.map(note => (note + interval) % 12);
        }

        // 配列をシャッフルする関数（ランダム生成用）
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.classList.remove('hidden');
            resultsArea.classList.add('hidden');
        }

        function hideError() {
            errorMessage.classList.add('hidden');
        }

        function validateInput(inputStr) {
            const parts = inputStr.replace(/,/g, ' ').trim().split(/\s+/).filter(Boolean);
            
            if (parts.length !== 12) {
                return { error: "エラー: ちょうど12個の音を入力してください。" };
            }

            const rowInts = [];
            for (let p of parts) {
                const val = noteToInt(p);
                if (val === -1) {
                    return { error: `エラー: 無効な音名が含まれています: ${p}` };
                }
                rowInts.push(val);
            }

            const uniqueNotes = new Set(rowInts);
            if (uniqueNotes.size !== 12) {
                return { error: "エラー: 12の音がすべて1回ずつ使われていません（重複があります）。" };
            }

            return { row: rowInts };
        }

        function renderResults(primeRow) {
            hideError();
            resultsArea.classList.remove('hidden');

            // --- 基本形(P0)の描画 ---
            const notesStr = primeRow.map(n => intToNote(n).padEnd(3, ' ')).join(' ');
            const label = `P0`.padEnd(3, ' ');
            primeList.textContent = `${label}: ${notesStr}\n`;

            // --- 12音マトリクスの描画 ---
            const firstNote = primeRow[0];
            const iIntervals = primeRow.map(n => (n - firstNote + 12) % 12);
            const pIntervals = iIntervals.map(i => (12 - i) % 12);

            let headHTML = '<tr><th class="border-r border-indigo-200"></th>';
            iIntervals.forEach(intVal => {
                headHTML += `<th>I${intVal}</th>`;
            });
            headHTML += '<th class="border-l border-indigo-200"></th></tr>';
            matrixHead.innerHTML = headHTML;

            let bodyHTML = '';
            for (let r = 0; r < 12; r++) {
                const pInt = pIntervals[r];
                const rowNotes = transpose(primeRow, pInt);
                
                bodyHTML += `<tr>`;
                bodyHTML += `<td class="font-bold text-indigo-900 bg-indigo-50 border-r border-indigo-200 border-b border-gray-200">P${pInt}</td>`;
                
                rowNotes.forEach(n => {
                    bodyHTML += `<td class="border border-gray-200 hover:bg-indigo-100 transition-colors cursor-default">${intToNote(n)}</td>`;
                });
                
                bodyHTML += `<td class="font-bold text-indigo-900 bg-indigo-50 border-l border-indigo-200 border-b border-gray-200">R${pInt}</td>`;
                bodyHTML += `</tr>`;
            }
            matrixBody.innerHTML = bodyHTML;

            let footHTML = '<tr><th class="border-r border-indigo-200"></th>';
            iIntervals.forEach(intVal => {
                footHTML += `<th>RI${intVal}</th>`;
            });
            footHTML += '<th class="border-l border-indigo-200"></th></tr>';
            matrixFoot.innerHTML = footHTML;
        }

        // マトリクス生成ボタン
        generateBtn.addEventListener('click', () => {
            const inputVal = noteInput.value;
            if (!inputVal) {
                showError("音列を入力してください。");
                return;
            }
            
            const result = validateInput(inputVal);
            if (result.error) {
                showError(result.error);
            } else {
                renderResults(result.row);
            }
        });

        // エンターキー対応
        noteInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                generateBtn.click();
            }
        });

        // 【追加部分】入力中のリアルタイム残音チェック処理
        noteInput.addEventListener('input', () => {
            const inputVal = noteInput.value;
            // 入力された文字を分割
            const parts = inputVal.replace(/,/g, ' ').trim().split(/\s+/).filter(Boolean);
            
            // 入力された有効な音を収集 (Setを使って重複を排除)
            const usedNotes = new Set();
            for (let p of parts) {
                const val = noteToInt(p);
                if (val !== -1) {
                    usedNotes.add(val);
                }
            }

            // まだ使われていない音を計算
            const remaining = [];
            for (let i = 0; i < 12; i++) {
                if (!usedNotes.has(i)) {
                    remaining.push(NOTES[i]);
                }
            }

            // UIの表示を更新
            if (remaining.length === 0 && usedNotes.size === 12 && parts.length === 12) {
                // 12個揃った場合
                remainingNotesContainer.innerHTML = '<span class="text-emerald-600 font-bold">すべての音が使われています。</span>';
            } else if (parts.length > 12) {
                // 音が多すぎる場合
                remainingNotesContainer.innerHTML = '<span class="text-red-500 font-bold">※ 音が多すぎます！（12個を超えています）</span>';
            } else {
                // 通常時（残りの音を表示）
                remainingNotesContainer.innerHTML = `残りの音: <span class="font-mono font-medium text-indigo-600 tracking-wider">${remaining.join(' ')}</span>`;
            }
        });

        // ランダム生成ボタンの処理
        randomBtn.addEventListener('click', () => {
            const randomRow = shuffle([...Array(12).keys()]);
            noteInput.value = randomRow.map(n => intToNote(n)).join(' ');
            
            // 【追加部分】残りの音の表示を「揃いました！」に更新させるため、強制的にinputイベントを発火
            noteInput.dispatchEvent(new Event('input'));
            
            renderResults(randomRow);
        });

        // CSVダウンロード処理
        downloadCsvBtn.addEventListener('click', () => {
            let csvContent = "";
            const table = document.querySelector(".matrix-table");
            if(!table) return;

            // テーブルの全行を取得
            const rows = table.querySelectorAll("tr");
            rows.forEach(function(row) {
                let rowData = [];
                // 見出しとセルのデータを取得
                const cols = row.querySelectorAll("th, td");
                cols.forEach(function(col) {
                    rowData.push(col.innerText);
                });
                // カンマ区切りで結合し、改行を追加
                csvContent += rowData.join(",") + "\n";
            });

            // 文字化け防止のためBOM (Byte Order Mark) を付与してBlobを作成
            const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", "twelve_tone_matrix.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        });

    </script>
</body>
</html>
